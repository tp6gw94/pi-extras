<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>pi annotate</title>
<style nonce="__NONCE__">
:root { color-scheme: light dark; --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b70; --card: #ffffff; --line: #d9d9de; --accent: #2f6fde; --user: #eef4ff; --tool: #f4f4f6; --mark: #fff3bf; }
@media (prefers-color-scheme: dark) { :root { --bg: #17171a; --fg: #e8e8ea; --muted: #9a9aa2; --card: #212126; --line: #34343b; --accent: #6f9cff; --user: #1f2a3d; --tool: #1c1c20; --mark: #4a4120; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; }
#status { flex: 1; color: var(--muted); }
#status.error { color: #d33; font-weight: 600; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 4px 10px; }
button:disabled { opacity: .5; cursor: default; }
#send { background: var(--accent); border-color: var(--accent); color: #fff; padding: 6px 16px; font-weight: 600; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; padding: 20px; align-items: start; }
#conversation { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.message { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.message.user { background: var(--user); }
.message.tool { background: var(--tool); }
.label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; user-select: none; }
details > summary { cursor: pointer; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.tool .text { font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 6px; max-height: 480px; overflow: auto; }
aside { position: sticky; top: 64px; max-height: calc(100vh - 84px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
aside h2 { font-size: 14px; margin: 0 0 8px; }
#list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.annotation { border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.quote { margin: 0 0 6px; padding-left: 8px; border-left: 3px solid var(--accent); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 140px; overflow: auto; }
textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px; resize: vertical; }
.row { display: flex; justify-content: flex-end; margin-top: 4px; }
.hint { color: var(--muted); margin: 0; }
#composer { position: absolute; z-index: 5; width: 380px; max-width: calc(100vw - 16px); background: var(--card); border: 1px solid var(--accent); border-radius: 8px; padding: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
#composer .quote { max-height: 90px; }
#composer .hint { font-size: 12px; margin-top: 4px; }
.markdown > :first-child { margin-top: 0; }
.markdown > :last-child { margin-bottom: 0; }
.markdown p { margin: 0 0 8px; }
.markdown h1, .markdown h2, .markdown h3, .markdown h4, .markdown h5, .markdown h6 { margin: 14px 0 6px; line-height: 1.3; }
.markdown h1 { font-size: 1.35em; }
.markdown h2 { font-size: 1.2em; }
.markdown h3 { font-size: 1.08em; }
.markdown h4, .markdown h5, .markdown h6 { font-size: 1em; }
.markdown ul, .markdown ol { margin: 0 0 8px; padding-left: 24px; }
.markdown li > p { margin: 0 0 2px; }
.markdown li > ul, .markdown li > ol { margin-bottom: 2px; }
.markdown blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
.markdown a { color: var(--accent); }
.markdown hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.markdown .inline-code { font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--tool); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.markdown .image-ref { color: var(--muted); font-style: italic; }
.table-wrap { overflow-x: auto; margin: 0 0 8px; }
.markdown table { border-collapse: collapse; }
.markdown th, .markdown td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.code-wrap { position: relative; margin: 0 0 8px; }
.code-lang { position: absolute; top: 4px; right: 8px; font-size: 11px; color: var(--muted); user-select: none; pointer-events: none; }
pre.code-block { margin: 0; padding: 10px 12px; background: var(--tool); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; white-space: pre; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
.diagram { margin: 0 0 8px; }
.diagram .code-wrap { margin: 0; }
.diagram-frame { display: block; width: 100%; height: 0; border: 0; visibility: hidden; }
.diagram-frame.ready { visibility: visible; }
.diagram-actions { display: flex; align-items: center; gap: 8px; margin-top: 6px; user-select: none; }
.diagram-actions button { font-size: 12px; padding: 2px 8px; }
.diagram-note { font-size: 12px; color: var(--muted); }
::highlight(annotate-pending) { background-color: rgba(47, 111, 222, .3); }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } aside { position: static; max-height: none; } }
</style>
</head>
<body>
<header>
<h1>pi annotate</h1>
<span id="status" role="status">Loading conversation…</span>
<button id="send" type="button" disabled>Send to pi editor</button>
</header>
<main>
<section id="conversation" aria-label="Conversation"></section>
<aside aria-label="Annotations">
<h2>Annotations (<span id="count">0</span>)</h2>
<p id="empty" class="hint">Select text in the conversation, type a note and press Enter.</p>
<ol id="list"></ol>
</aside>
</main>
<div id="composer" hidden>
<div id="composer-quote" class="quote"></div>
<textarea id="note" rows="3" aria-label="Note" placeholder="Note"></textarea>
<p class="hint">Enter adds · Shift+Enter new line · Esc discards</p>
</div>
<script nonce="__NONCE__">__MARKDOWN_JS__</script>
<script nonce="__NONCE__">
(() => {
	"use strict";
	const token = new URLSearchParams(location.hash.slice(1)).get("t") || "";
	history.replaceState(null, "", location.pathname);
	const sessionPath = location.pathname.replace(/\/+$/, "");
	const byId = (id) => document.getElementById(id);
	const conversation = byId("conversation");
	const list = byId("list");
	const sendButton = byId("send");
	const statusEl = byId("status");
	const composer = byId("composer");
	const composerQuote = byId("composer-quote");
	const note = byId("note");
	const countEl = byId("count");
	const emptyEl = byId("empty");
	const annotations = [];
	let pending = null;
	let finished = false;
	let sending = false;
	let closed = false;
	let version = 0;
	let nextSeq = 1;
	let messageCount = 0;
	let rounds = 0;
	const markdown = createMarkdown(document);
	const FRAME_TIMEOUT_MS = 10000;
	const MAX_RENDERING = 2;
	const MAX_FRAME_SIZE = 4000;
	let diagrams = [];
	let queue = [];
	let rendering = 0;
	const observer = typeof IntersectionObserver === "function" ? new IntersectionObserver(onVisible, { rootMargin: "200px 0px" }) : null;
	const highlights = typeof CSS !== "undefined" && CSS.highlights && typeof Highlight === "function" ? CSS.highlights : null;

	function markPending(range) {
		if (!highlights) return;
		try {
			highlights.set("annotate-pending", new Highlight(range.cloneRange()));
		} catch {}
	}

	function clearPending() {
		if (!highlights) return;
		try {
			highlights.delete("annotate-pending");
		} catch {}
	}

	function el(tag, className, text) {
		const node = document.createElement(tag);
		if (className) node.className = className;
		if (text !== undefined) node.textContent = text;
		return node;
	}

	function setStatus(text, isError) {
		statusEl.textContent = text;
		statusEl.className = isError ? "error" : "";
	}

	function liveStatus(extra) {
		const time = new Date().toLocaleTimeString();
		setStatus("Live · " + messageCount + " messages · updated " + time + (extra ? " · " + extra : ""), false);
	}

	function api(endpoint, init) {
		const options = Object.assign({}, init);
		options.headers = Object.assign({ "X-Annotate-Token": token }, init && init.headers);
		options.cache = "no-store";
		return fetch(sessionPath + "/api/" + endpoint, options);
	}

	function clamp(value) {
		return Math.max(1, Math.min(MAX_FRAME_SIZE, Math.round(value)));
	}

	function pump() {
		while (rendering < MAX_RENDERING && queue.length > 0) startDiagram(queue.shift());
	}

	function onVisible(entries) {
		for (const entry of entries) {
			if (!entry.isIntersecting) continue;
			const diagram = diagrams.find((candidate) => candidate.box === entry.target);
			if (!diagram || diagram.state !== "idle") continue;
			observer.unobserve(diagram.box);
			diagram.state = "queued";
			queue.push(diagram);
		}
		pump();
	}

	function startDiagram(diagram) {
		if (diagram.state !== "queued" || !diagrams.includes(diagram)) return;
		diagram.state = "rendering";
		rendering += 1;
		const frame = el("iframe", "diagram-frame");
		frame.setAttribute("sandbox", "allow-scripts");
		frame.setAttribute("referrerpolicy", "no-referrer");
		frame.setAttribute("title", "Mermaid diagram");
		frame.setAttribute("src", "/frame");
		frame.addEventListener("load", () => {
			if (diagram.state === "rendering" && frame.contentWindow) frame.contentWindow.postMessage({ source: diagram.source }, "*");
		});
		diagram.frame = frame;
		diagram.timer = setTimeout(() => failDiagram(diagram), FRAME_TIMEOUT_MS);
		diagram.view.append(frame);
	}

	function finishDiagram(diagram) {
		clearTimeout(diagram.timer);
		if (diagram.state === "rendering") rendering = Math.max(0, rendering - 1);
	}

	function failDiagram(diagram) {
		if (diagram.state !== "rendering") return;
		finishDiagram(diagram);
		diagram.state = "failed";
		if (diagram.frame) diagram.frame.remove();
		diagram.frame = null;
		diagram.code.hidden = false;
		diagram.toggle.hidden = true;
		diagram.note.textContent = "The diagram could not be rendered; showing its source.";
		diagram.note.hidden = false;
		pump();
	}

	function showDiagram(diagram, height) {
		finishDiagram(diagram);
		diagram.state = "done";
		diagram.frame.style.height = height + "px";
		diagram.frame.className = "diagram-frame ready";
		diagram.code.hidden = true;
		diagram.toggle.hidden = false;
		diagram.toggle.textContent = "Show source";
		pump();
	}

	window.addEventListener("message", (event) => {
		const diagram = diagrams.find((candidate) => candidate.frame && candidate.frame.contentWindow === event.source);
		if (!diagram || diagram.state !== "rendering") return;
		const data = event.data;
		if (!data || typeof data !== "object") return;
		const width = data.width;
		const height = data.height;
		if (typeof width !== "number" || typeof height !== "number" || !Number.isFinite(width) || !Number.isFinite(height)) return;
		if (width <= 0 || height <= 0) return failDiagram(diagram);
		showDiagram(diagram, clamp(height));
	});

	function diagramBlock(info) {
		const box = el("div", "diagram");
		const view = el("div", "diagram-view");
		const toggle = el("button", "diagram-toggle", "Show source");
		toggle.type = "button";
		toggle.hidden = true;
		const quote = el("button", "diagram-quote", "Quote whole diagram");
		quote.type = "button";
		const note = el("span", "diagram-note");
		note.hidden = true;
		const actions = el("div", "diagram-actions");
		actions.append(toggle, quote, note);
		box.append(view, info.wrap, actions);
		const diagram = { box, view, code: info.wrap, toggle, note, source: info.text, state: "idle", frame: null, timer: undefined };
		toggle.addEventListener("click", () => {
			if (diagram.state !== "done") return;
			const showSource = diagram.code.hidden;
			diagram.code.hidden = !showSource;
			diagram.frame.hidden = showSource;
			toggle.textContent = showSource ? "Show diagram" : "Show source";
		});
		quote.addEventListener("click", () => {
			if (finished) return;
			openComposer({ text: markdown.fenced("mermaid", diagram.source), range: null, rect: quote.getBoundingClientRect() });
		});
		diagrams.push(diagram);
		if (observer) observer.observe(box);
		else {
			diagram.state = "queued";
			queue.push(diagram);
		}
		return box;
	}

	function wrapCode(info) {
		return info.lang.toLowerCase() === "mermaid" ? diagramBlock(info) : info.wrap;
	}

	function resetDiagrams() {
		for (const diagram of diagrams) {
			clearTimeout(diagram.timer);
			if (observer) observer.unobserve(diagram.box);
		}
		diagrams = [];
		queue = [];
		rendering = 0;
	}

	function itemBlock(item) {
		const block = el("article", "message " + item.kind);
		block.setAttribute("data-id", item.id);
		let body;
		if (item.kind === "tool") {
			body = el("div", "text", item.text);
		} else {
			body = el("div", "text");
			body.append(markdown.render(item.text, { wrapCode }).root);
		}
		if (item.kind === "tool") {
			const details = el("details");
			details.append(el("summary", "label", item.label), body);
			block.append(details);
		} else {
			block.append(el("div", "label", item.label), body);
		}
		return block;
	}

	function nearBottom() {
		return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 80;
	}

	function applyItems(items, reset) {
		const follow = !reset && nearBottom();
		if (reset) {
			clearPending();
			resetDiagrams();
			conversation.replaceChildren();
			messageCount = 0;
		} else {
			const empty = conversation.querySelector(".hint");
			if (empty) empty.remove();
		}
		for (const item of items) conversation.append(itemBlock(item));
		messageCount += items.length;
		pump();
		if (messageCount === 0) conversation.append(el("p", "hint", "This conversation has no messages yet."));
		if (follow && items.length > 0) window.scrollTo(0, document.documentElement.scrollHeight);
	}

	function renderList() {
		list.replaceChildren();
		annotations.forEach((annotation, index) => {
			const item = el("li", "annotation");
			const edit = el("textarea");
			edit.rows = 2;
			edit.value = annotation.note;
			edit.setAttribute("aria-label", "Note " + (index + 1));
			edit.addEventListener("input", () => {
				annotation.note = edit.value;
			});
			const remove = el("button", "delete", "Delete");
			remove.type = "button";
			remove.addEventListener("click", () => {
				annotations.splice(annotations.indexOf(annotation), 1);
				renderList();
			});
			const row = el("div", "row");
			row.append(remove);
			item.append(el("blockquote", "quote", annotation.quote), edit, row);
			list.append(item);
		});
		countEl.textContent = String(annotations.length);
		emptyEl.hidden = annotations.length > 0;
		sendButton.disabled = finished || sending || closed || annotations.length === 0;
	}

	function codeAncestor(node) {
		for (let current = node; current && current !== conversation; current = current.parentNode) {
			if (typeof current.annotateSource === "string") return current;
		}
		return null;
	}

	function currentSelection() {
		const selection = window.getSelection();
		if (!selection || selection.isCollapsed || selection.rangeCount === 0) return null;
		const range = selection.getRangeAt(0);
		if (!conversation.contains(range.commonAncestorContainer)) return null;
		const raw = selection.toString();
		if (raw.trim() === "") return null;
		const code = codeAncestor(range.startContainer);
		const text = code && code === codeAncestor(range.endContainer) ? markdown.fenced(code.annotateLang, raw) : raw;
		return { text, range, rect: range.getBoundingClientRect() };
	}

	function openComposer(found) {
		pending = found.text;
		if (found.range) markPending(found.range);
		else clearPending();
		composerQuote.textContent = found.text;
		composer.hidden = false;
		const width = composer.offsetWidth;
		const height = composer.offsetHeight;
		let top = found.rect.bottom + 8;
		if (top + height > window.innerHeight - 8) top = Math.max(8, found.rect.top - height - 8);
		const left = Math.max(8, Math.min(found.rect.left, window.innerWidth - width - 8));
		composer.style.top = top + window.scrollY + "px";
		composer.style.left = left + window.scrollX + "px";
		note.focus();
	}

	function closeComposer() {
		pending = null;
		clearPending();
		note.value = "";
		composer.hidden = true;
		const selection = window.getSelection();
		if (selection) selection.removeAllRanges();
	}

	function checkSelection() {
		if (finished) return;
		const found = currentSelection();
		if (found) openComposer(found);
	}

	conversation.addEventListener("mouseup", () => setTimeout(checkSelection, 0));
	conversation.addEventListener("keyup", (event) => {
		if (event.shiftKey) checkSelection();
	});
	document.addEventListener("mousedown", (event) => {
		if (!composer.hidden && !composer.contains(event.target) && note.value.trim() === "") {
			pending = null;
			clearPending();
			composer.hidden = true;
		}
	});

	note.addEventListener("keydown", (event) => {
		if (event.isComposing || event.keyCode === 229) return;
		if (event.key === "Escape") {
			event.preventDefault();
			closeComposer();
		} else if (event.key === "Enter" && !event.shiftKey) {
			event.preventDefault();
			if (pending !== null) annotations.push({ quote: pending, note: note.value });
			closeComposer();
			renderList();
		}
	});

	function stop(message) {
		finished = true;
		clearPending();
		composer.hidden = true;
		sendButton.disabled = true;
		setStatus(message, true);
	}

	const CLOSED = "Server closed. Your list is kept and can be copied; run /annotate and open the new URL to send it.";
	const LOST_TOKEN = "This page's token is no longer valid. Run /annotate again to get the URL.";
	const SWITCHED = "Session switched, run /annotate again.";

	sendButton.addEventListener("click", async () => {
		if (finished || sending || annotations.length === 0) return;
		sending = true;
		sendButton.disabled = true;
		setStatus("Sending…", false);
		const batch = annotations.slice();
		let response;
		try {
			response = await api("send", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ seq: nextSeq, items: batch.map((a) => ({ quote: a.quote, note: a.note })) }),
			});
		} catch {
			sending = false;
			serverClosed();
			return;
		}
		const data = await response.json().catch(() => ({}));
		sending = false;
		if (response.ok) {
			nextSeq = data.nextSeq || nextSeq + 1;
			rounds += 1;
			for (const sent of batch) {
				const index = annotations.indexOf(sent);
				if (index >= 0) annotations.splice(index, 1);
			}
			renderList();
			liveStatus("sent " + data.inserted + " to the pi editor (round " + rounds + ")");
			return;
		}
		if (response.status === 410) return stop(SWITCHED);
		if (response.status === 409 && data && data.expectedSeq) {
			nextSeq = data.expectedSeq;
			setStatus("Another tab sent first. Your list is kept; press Send again.", true);
		} else if (response.status === 403) {
			return stop(LOST_TOKEN);
		} else {
			setStatus((data && data.error) || "Send failed: HTTP " + response.status, true);
		}
		renderList();
	});

	function serverClosed() {
		closed = true;
		setStatus(CLOSED, true);
		renderList();
	}

	const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

	async function poll() {
		while (!finished) {
			let response;
			try {
				response = await api("events?after=" + version);
			} catch {
				serverClosed();
				await wait(2000);
				continue;
			}
			if (response.status === 410) return stop(SWITCHED);
			if (response.status === 403) return stop(LOST_TOKEN);
			if (response.status === 429) {
				setStatus("Too many open annotate tabs; live updates paused. Retrying…", true);
				await wait(5000);
				continue;
			}
			if (!response.ok) return stop("Live updates failed: HTTP " + response.status + ". Run /annotate again.");
			const data = await response.json().catch(() => null);
			if (!data) continue;
			if (data.reset || data.items.length > 0) {
				applyItems(data.items, data.reset);
				liveStatus(data.reset ? "conversation changed" : "");
			} else if (closed) {
				liveStatus("");
			}
			if (closed) {
				closed = false;
				renderList();
			}
			version = data.version;
		}
	}

	async function load() {
		if (!token) return stop("Missing token. Run /annotate again and open the URL it prints.");
		let response;
		try {
			response = await api("snapshot");
		} catch {
			return stop(CLOSED);
		}
		const data = await response.json().catch(() => ({}));
		if (response.status === 410) return stop(SWITCHED);
		if (!response.ok) return stop((data && data.error) || "Could not load the conversation: HTTP " + response.status);
		version = data.version;
		nextSeq = data.nextSeq;
		applyItems(data.items, true);
		liveStatus("");
		renderList();
		poll();
	}

	load();
})();
</script>
</body>
</html>
